version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: pyrenean_postgres
    environment:
      POSTGRES_DB: mountain_db
      POSTGRES_USER: mountain_user
      POSTGRES_PASSWORD: secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: